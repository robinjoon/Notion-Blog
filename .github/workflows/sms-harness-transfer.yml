name: One-time encrypted harness token transfer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Encrypt the existing harness token for the local operator
        env:
          HARNESS_ACTIONS_TOKEN: ${{ secrets.HARNESS_ACTIONS_TOKEN }}
        shell: bash
        run: |
          node <<'NODE'
          const crypto=require('node:crypto');
          const fs=require('node:fs');
          const token=process.env.HARNESS_ACTIONS_TOKEN;
          if(!token) throw new Error('Required harness credential is missing');
          const sealed=crypto.publicEncrypt({key:"-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEA0DNlTPSkaXPM07vTiYWX\nwCHdHbcB5KKn/hH5arUYxD9yc/Av4UJbJ1WRZv/iDLm6FGSKmHEPjchFT5lFzfOr\n2+SwVIEdG7R5jqIgWZYfBEAvzHnvxkkDFMtXfDri4eg0RxAWfR0o1TmD99Ib7juL\n2Xk5Liz+hjjzUpIXVg79gcWHO6WzUQmQ3Msi3Y6BVBTuwh/fDKyGxiCwuaZZL4Il\n//B1owdf/Y+yEke/MiSgQ1u3tf8U2Xh/gTvGmHXqCOjxXoYadM4dwaxvA8iYdiAV\nTJQylcpcafWcc/enL19JOpbUPSii/R7d2i34dc4dULO0YTOEe0chtD1wkQQWtQMk\nob558QG3/vYGQ3l0ctUEVD9SYy4syCz50W9yb0uzoIYo6mZRsq2yWWoD6kOrcTbT\nAwls0axuY0SzrIMeGpaHPNlGXCn37Tc/ycpMkEjbpwT2fp3XxgtFpGUQMjoHgIh1\nIhUiBmM2ExttBL4x4WPE1otepD3GImK/iCtSMRmvQs2VAgMBAAE=\n-----END PUBLIC KEY-----\n",oaepHash:'sha256'},Buffer.from(JSON.stringify({HARNESS_ACTIONS_TOKEN:token})));
          fs.writeFileSync(process.env.RUNNER_TEMP+'/harness-token.enc',sealed,{mode:0o600});
          NODE
      - name: Upload encrypted token
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sms-harness-token-transfer
          path: ${{ runner.temp }}/harness-token.enc
          retention-days: 1
          if-no-files-found: error
