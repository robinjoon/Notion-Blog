name: One-time encrypted SMS credential transfer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Encrypt only the three existing CI credentials
        env:
          REGISTRY_USERNAME: ${{ secrets.HOMELAB_REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.HOMELAB_REGISTRY_PASSWORD }}
          HARNESS_ACTIONS_TOKEN: ${{ secrets.HARNESS_ACTIONS_TOKEN }}
        shell: bash
        run: |
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const fields = ['REGISTRY_USERNAME', 'REGISTRY_PASSWORD', 'HARNESS_ACTIONS_TOKEN'];
          if (fields.some(name => !process.env[name])) throw new Error('A required migration credential is missing');
          const payload = JSON.stringify({
            zot: {REGISTRY_USERNAME:process.env.REGISTRY_USERNAME, REGISTRY_PASSWORD:process.env.REGISTRY_PASSWORD},
            harness: {HARNESS_ACTIONS_TOKEN:process.env.HARNESS_ACTIONS_TOKEN}
          });
          const key = crypto.randomBytes(32);
          const iv = crypto.randomBytes(12);
          const cipher = crypto.createCipheriv('aes-256-gcm',key,iv);
          const ciphertext = Buffer.concat([cipher.update(payload,'utf8'),cipher.final()]);
          const wrappedKey = crypto.publicEncrypt({key:"-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAu2IyKPh9Czc9Q/TT5nJU\n8f5uKndAqQOvrNYPC7LHq4mwmqjxSc7inBjc0i6YAvXr8boHX0czXMDWZuFPlsIm\npTX4o5V/ih970mAi51jQTM73nV3sOJCwNUCt0NJ4NtwKprbbkH8edephdDqTCqoj\nUPuMxYsqdOJXwlSr3N5LLLLGvLYBUgHp08+WcELmqU7Ccd6+Xrdi+oQW79oPWTfA\nrCPhghqdqYco5NeSK+PNoCeV16FI8L/aUaRzDXrdeDrKx85T/1vF8PQsmHOJq0XD\n2vpF0+TMKC4RYgTsIlSsJPo2OENu2gTOaWEgMFNS9MVVcFFq7TlSzCSyXNSULm1w\nDU4/y9sIBwrBT6x7mRvTEMyUglj6kJcypg1qONdvnrLGx1jI8FLfN/9fTi3l0Dfj\nrj32+kHlF6GkKHWFF5J9Z0TrJsRuuoqTCz3H0nwxJnOoVQxxS+6X9YenXR9wdM7K\nQF/ah/DMpzorElKnBmppyIFgsEEsVNOEi7eeCzaMjplRAgMBAAE=\n-----END PUBLIC KEY-----\n",oaepHash:'sha256'},key);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/sms-transfer.json',JSON.stringify({
            key:wrappedKey.toString('base64'),iv:iv.toString('base64'),tag:cipher.getAuthTag().toString('base64'),ciphertext:ciphertext.toString('base64')
          }),{mode:0o600});
          NODE
      - name: Upload encrypted envelope
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sms-credential-transfer
          path: ${{ runner.temp }}/sms-transfer.json
          retention-days: 1
          if-no-files-found: error
