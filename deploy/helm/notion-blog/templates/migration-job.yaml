apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "notion-blog.fullname" . }}-migration
  labels:
    {{- include "notion-blog.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "notion-blog.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
        {{- with .Values.migration.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.migration.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migration
          image: {{ include "notion-blog.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["pnpm", "db:migrate"]
          {{- include "notion-blog.secretEnvFrom" . | nindent 10 }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
