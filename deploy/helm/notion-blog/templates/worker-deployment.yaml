apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notion-blog.fullname" . }}-worker
  labels:
    {{- include "notion-blog.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "notion-blog.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "notion-blog.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        {{- with .Values.worker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: worker
          image: {{ include "notion-blog.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["pnpm", "worker"]
          {{- include "notion-blog.secretEnvFrom" . | nindent 10 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
